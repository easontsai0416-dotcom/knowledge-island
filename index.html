<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>知識島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column (max 720px) shaped like a phone deck; screens swap in place: home, lobby, battle, result, shop. */
:root{
  --bg:#E4F2F0; --surface:#FFFFFF; --surface-2:#D3E9E6; --ink:#0D2B33; --ink-2:#4B6A70; --line:#B7D5D2;
  --sea:#0E7C8B; --sea-ink:#FFFFFF; --coral:#D9443A; --coral-ink:#FFFFFF; --sun:#F6B93B; --sun-ink:#3A2A00;
  --palm:#238B5E; --ok-bg:#DDF3E7; --bad:#D43F3F; --bad-bg:#FBE1DE; --focus:#F6B93B;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-display:"Fredoka","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071E26; --surface:#0F323C; --surface-2:#14424F; --ink:#E6F6F3; --ink-2:#8FB5B8; --line:#1F5663;
    --sea:#3CC0CF; --sea-ink:#04222A; --coral:#FF7A6B; --coral-ink:#2A0A07; --sun:#FFCB5C; --sun-ink:#3A2A00;
    --palm:#4CC38A; --ok-bg:#12402D; --bad:#FF7B7B; --bad-bg:#4A1E1E; --focus:#FFCB5C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071E26; --surface:#0F323C; --surface-2:#14424F; --ink:#E6F6F3; --ink-2:#8FB5B8; --line:#1F5663;
  --sea:#3CC0CF; --sea-ink:#04222A; --coral:#FF7A6B; --coral-ink:#2A0A07; --sun:#FFCB5C; --sun-ink:#3A2A00;
  --palm:#4CC38A; --ok-bg:#12402D; --bad:#FF7B7B; --bad-bg:#4A1E1E; --focus:#FFCB5C; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3,p{margin:0}
h2{font-family:var(--font-display);font-size:22px;font-weight:700;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.muted{color:var(--ink-2);font-size:14px}
.label{font-size:12px;letter-spacing:.08em;color:var(--ink-2);font-weight:700}

/* top bar */
.bar-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.avatar{flex:none;width:48px;height:48px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:28px}
.who{flex:1;min-width:150px;display:flex;flex-direction:column;gap:4px}
.who input{font:inherit;font-weight:700;font-size:18px;background:transparent;color:var(--ink);border:0;border-bottom:2px dashed var(--line);padding:0 0 2px;width:100%;max-width:200px;border-radius:0}
.lv{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.xp{flex:1;max-width:140px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.xp i{display:block;height:100%;background:var(--palm)}
.coins{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px 6px 8px;font-family:var(--font-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.coin{width:24px;height:24px;flex:none}

/* hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.hero h1{font-family:var(--font-display);font-size:clamp(44px,12vw,64px);line-height:1;font-weight:700;letter-spacing:.02em;color:var(--sea)}
.hero p{margin-top:8px;color:var(--ink-2)}
.hero svg{flex:none;width:clamp(96px,26vw,150px);height:auto}
.f-sun{fill:var(--sun)}.f-sea{fill:var(--sea)}.f-palm{fill:var(--palm)}.f-sand{fill:var(--surface-2)}.s-trunk{stroke:var(--ink-2);fill:none}

/* controls */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--sea);color:var(--sea-ink);border-color:var(--sea);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px;cursor:pointer;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.btn{border:0;border-radius:12px;padding:14px 20px;font-weight:700;cursor:pointer;background:var(--sea);color:var(--sea-ink);min-height:48px}
.btn.go{background:var(--coral);color:var(--coral-ink);font-size:20px;font-family:var(--font-display);padding:16px 20px;width:100%;letter-spacing:.04em}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 140px}
.field{display:flex;gap:10px;flex-wrap:wrap}
.field input{flex:1 1 120px;min-width:0;font:inherit;font-size:20px;font-family:var(--font-display);letter-spacing:.12em;text-transform:uppercase;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.note{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.err{font-size:14px;color:var(--bad);font-weight:500}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.stats b{color:var(--ink);font-family:var(--font-display);font-size:18px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.rules div{background:var(--surface-2);border-radius:10px;padding:10px 4px}
.rules b{display:block;font-family:var(--font-display);font-size:22px;color:var(--sea)}
.rules span{font-size:12px;color:var(--ink-2)}

/* lobby */
.code{font-family:var(--font-display);font-size:40px;letter-spacing:.2em;font-weight:700;color:var(--sea)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:12px;padding:8px 12px}
.plist .avatar{width:40px;height:40px;font-size:24px;background:var(--surface)}
.tag{font-size:12px;font-weight:700;background:var(--sun);color:var(--sun-ink);border-radius:99px;padding:2px 8px;margin-left:8px}

/* battle */
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hud .pill{background:var(--surface-2);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:700}
.score{font-family:var(--font-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.phase{display:inline-block;border-radius:8px;padding:4px 12px;font-weight:900;letter-spacing:.06em}
.phase.look{background:var(--sun);color:var(--sun-ink)}
.phase.race{background:var(--coral);color:var(--coral-ink)}
.timer{display:flex;align-items:center;gap:12px}
.track{flex:1;height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;background:var(--sea);transform-origin:left center;transform:scaleX(1)}
.fill.low{background:var(--coral)}
#tm{font-family:var(--font-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:3.6ch;text-align:right}
.q{font-size:clamp(20px,5.2vw,26px);font-weight:700;line-height:1.55;text-wrap:pretty;overflow-wrap:anywhere}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:60px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt .L{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--font-display);font-weight:700}
.opt:active:not([disabled]){transform:scale(.985)}
.opt.sel{border-color:var(--sea);background:var(--surface-2)}
.opt.dim{opacity:.55}
.opt.right{border-color:var(--palm);background:var(--ok-bg);opacity:1}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:1}
.opt.mask{cursor:default;border-style:dashed}
.sk{display:block;height:12px;width:60%;border-radius:99px;background:var(--surface-2)}
.live{font-size:14px;color:var(--ink-2)}
.live b{font-family:var(--font-display);font-size:20px;color:var(--coral);font-variant-numeric:tabular-nums}
.banner{border-radius:12px;padding:12px 14px;font-weight:700}
.banner.ok{background:var(--ok-bg);color:var(--ink)}
.banner.no{background:var(--bad-bg);color:var(--ink)}
.count{text-align:center;padding:24px 0}
.count b{display:block;font-family:var(--font-display);font-size:96px;line-height:1;color:var(--coral)}

/* standings */
.stand{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.stand li{display:grid;grid-template-columns:22px 28px minmax(60px,110px) 1fr auto auto;align-items:center;gap:8px;font-size:14px}
.stand .rk{font-family:var(--font-display);font-weight:700;color:var(--ink-2)}
.stand .av{font-size:20px;text-align:center}
.stand .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stand .nm em{font-style:normal;font-size:11px;font-weight:700;background:var(--sea);color:var(--sea-ink);border-radius:99px;padding:1px 6px;margin-left:4px}
.stand .trk{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.stand .trk i{display:block;height:100%;background:var(--sea);border-radius:99px}
.stand li.me .trk i{background:var(--coral)}
.stand b{font-family:var(--font-display);font-variant-numeric:tabular-nums;min-width:3.4ch;text-align:right}
.stand .dl{font-size:12px;color:var(--palm);font-weight:700;min-width:3.6ch;font-variant-numeric:tabular-nums}

/* result */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface-2);border-radius:12px;padding:12px 8px;text-align:center}
.tile b{display:block;font-family:var(--font-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--ink-2)}
.qchips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qc{border-radius:10px;padding:8px 2px;text-align:center;font-size:12px;background:var(--surface-2);min-width:0}
.qc b{display:block;font-family:var(--font-display);font-size:16px}
.qc.ok{background:var(--ok-bg)}.qc.no{background:var(--bad-bg)}
.up{background:var(--sun);color:var(--sun-ink);font-weight:900;border-radius:10px;padding:10px 12px;text-align:center}

/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.item .big{font-size:44px;line-height:1}
.item .btn{padding:8px 12px;min-height:40px;width:100%;font-size:14px}
.item.on{border:2px solid var(--sea)}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.rankcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rk-body{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px}
.rk-name{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.1}
.ladder{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.ladder span{opacity:.3;display:block;line-height:0}
.ladder span.on{opacity:1}
.ladder span.cur{outline:2px solid var(--sun);outline-offset:2px;border-radius:50%}
.bank{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bank>div{flex:1;min-width:200px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

[`下列成語使用，何者最恰當？`,`情節「引人入勝」|做事「首鼠兩端」很果斷|災區一片「欣欣向榮」|「春風化雨」地嚴厲責罵`,"A"],
[`周敦頤《愛蓮說》：「牡丹之愛，宜乎眾矣。」暗諷世人追逐什麼？`,`隱居生活|富貴名利|園藝技術|隱逸高潔`,"B"],
[`「人一能之，己百之；人十能之，己千之。」最適合勉勵哪種人？`,`驕傲的天才|勤能補拙者|體弱多病者|投機取巧者`,"B"],

[`成本 1000 元的衣服加兩成定價，再打九折賣出，售價是多少元？`,`1080 元|1100 元|1200 元|900 元`,"A"],

function saveText(){
  if(cloud.st==="checking")return "正在讀取雲端存檔…";

function paintSave(){

async function push(){
  if(!CLOUD||pushing||!dirty)return;
  pushing=true;dirty=false;cloud.st="saving";paintSave();
  try{
    const snap=JSON.parse(JSON.stringify(SAVE));
    await CLOUD.set({save:snap,ts:snap.ts});
    cloud.st="ok";cloud.at=Date.now();
  }catch(e){
    const c=e&&e.code;
    if(c==="invalid_argument"||c==="revoked"||c==="not_granted"||c==="capability_disabled"||c==="capability_removed"){cloud.st="off";CLOUD=null;}
    else{cloud.st="err";dirty=true;clearTimeout(pushT);pushT=setTimeout(push,15000);}
  }
  pushing=false;paintSave();
  if(dirty&&cloud.st==="ok"){clearTimeout(pushT);pushT=setTimeout(push,500);}
}
function sanitize(c){
  const d=defaults(),n=(v,def,lo,hi)=>Number.isFinite(Number(v))?Math.max(lo,Math.min(hi,Number(v))):def;
  const owned=Array.isArray(c.owned)?c.owned.filter(e=>AV_OK.has(e)):[];
  if(!owned.includes("🏝️"))owned.unshift("🏝️");
  return {name:typeof c.name==="string"&&c.name?c.name.slice(0,8):d.name,xp:n(c.xp,0,0,1e9),coins:n(c.coins,0,0,1e9),owned,av:owned.includes(c.av)?c.av:"🏝️",
    games:n(c.games,0,0,1e9),wins:n(c.wins,0,0,1e9),bankAt:n(c.bankAt,0,0,4e12),rank:Math.floor(n(c.rank,0,0,RANKS.length-1)),rw:Math.floor(n(c.rw,0,0,1e6)),ts:n(c.ts,0,0,4e12)};
}
async function initCloud(){

    if(!db||!uid){cloud.st="off";return paintSave();}
    const ref=db.doc("data/users/"+uid+"/save");
    const snap=await ref.get();
    const cs=snap.exists&&snap.data()?snap.data().save:null;
    CLOUD=ref;
    if(cs&&typeof cs==="object"&&(Number(cs.ts)||0)>(Number(SAVE.ts)||0)){
      while(match)await new Promise(r=>setTimeout(r,1000));
      SAVE=sanitize(cs);persist(true);

      cloud.st="ok";cloud.at=Date.now();
    }else{
      dirty=true;await push();
    }
  }catch(e){cloud.st="off";CLOUD=null;}
  paintSave();
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function shuffled(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickQs(subj){

    const pool=ALL.filter(q=>q.d===d&&(subj==="all"||q.s===subj)&&!picks.includes(q));
    picks.push(pool[Math.floor(Math.random()*pool.length)]);
  });
  return picks;
}

function viewers(){return NR?NR.peers().filter(p=>p.kind==="viewer"&&p.presence&&p.presence.n!==undefined).sort((a,b)=>a.peer<b.peer?-1:1):[];}
function cleanName(v){return String(v||"玩家").replace(/[\u0000-\u001f]/g,"").slice(0,10)||"玩家";}
function cleanAv(v){return AV_OK.has(v)?v:"🏝️";}
function renderLobby(){

    <p class="muted">${ps.length} 位玩家在房間裡</p>

    ${isHost?`<div class="chips">${wagerChips()}</div>`:`<p><b>$${w}</b></p>`}
    <p class="muted">這局有 ${elig.length} 位玩家出得起賭注，獎池 $${w*elig.length}，第一名全拿。</p>
    ${isHost?`<button class="btn go" data-act="startmulti" ${canStart?"":"disabled"}>開始對戰</button>${canStart?"":'<p class="muted">至少要 2 位金幣足夠的玩家才能開始。</p>'}`:`<p class="note">${SAVE.coins<w?"你的金幣不足 $"+w+"，這局無法參加。回到首頁的銀行領錢後再來。":"等待房主開始對戰…"}</p>`}
    ${ui.err?`<p class="err">${esc(ui.err)}</p>`:""}

function setPresence(st){if(!NR)return;NR.presence({n:SAVE.name,av:SAVE.av,lv:levelOf(SAVE.xp).lvl,c:SAVE.coins,w:ui.wager,st:st||"lobby"}).catch(()=>{});}
async function joinRoom(code){
  ui.err="";
  if(!ROOM){ui.err="目前無法連線。";return render();}
  ui.busy=true;render();
  try{NR=await ROOM.join("island-"+code.toLowerCase());}
  catch(e){ui.busy=false;ui.err="進不去房間（"+((e&&e.code)||"錯誤")+"），請稍後再試。";return render();}
  ui.busy=false;ui.code=code;
  offs.push(NR.on("start",onStart),NR.on("score",onScore),NR.onPeers(()=>{if(ui.screen==="lobby")renderLobby();if(match&&match.mode==="multi")refreshStand();}));
  setPresence("lobby");
  ui.screen="lobby";render();
}
function leaveRoom(){
  offs.forEach(f=>{try{f();}catch(e){}});offs=[];
  if(NR){NR.leave().catch(()=>{});NR=null;}
  stopTicker();match=null;myPeer=null;ui.screen="home";ui.err="";render();
}
function genCode(){const c="abcdefghjkmnpqrstuvwxyz23456789";let s="";for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function hostStart(){
  ui.err="";
  const w=ui.wager;
  const elig=viewers().filter(p=>Number(p.presence.c)>=w);
  if(elig.length<2||SAVE.coins<w)return;
  const qs=pickQs(ui.subj);
  const d={mid:Math.random().toString(36).slice(2,10),qs:qs.map(q=>q.id),seed:Math.floor(Math.random()*1e9),w,pl:elig.map(p=>p.peer)};
  const send=()=>NR&&NR.emit("start",d).catch(e=>{if(e&&e.code==="not_permitted"){ui.err="這個帳號沒有開局權限，需要有貢獻者以上的權限。";render();}});
  send();setTimeout(send,400);setTimeout(send,1200);
}
function onStart(msg){
  const d=msg.data;
  if(!d||typeof d.mid!=="string"||!Array.isArray(d.qs)||d.qs.length!==N||!Array.isArray(d.pl))return;
  if(match||d.mid===seenMid)return;
  const w=Number(d.w);
  if(!WAGERS.includes(w)||d.pl.length<2||d.pl.length>16||d.pl.some(x=>typeof x!=="string"))return;
  if(d.qs.some(i=>!Number.isInteger(i)||!ALL[i]))return;
  const qs=d.qs.map(i=>ALL[i]);
  const cur=NR?NR.peers():[];
  const meP=cur.find(p=>p.sameTab);
  const meKey=meP?meP.peer:myPeer;
  seenMid=d.mid;
  if(!meKey||!d.pl.includes(meKey)){ui.err="這局你金幣不足，沒有參加。";if(ui.screen==="lobby")render();return;}
  if(SAVE.coins<w){ui.err="金幣不足 $"+w+"，這局沒有參加。";if(ui.screen==="lobby")render();return;}
  const players={};
  d.pl.forEach(k=>{const p=cur.find(x=>x.peer===k);players[k]={name:p&&p.presence?cleanName(p.presence.n):"玩家",av:p&&p.presence?cleanAv(p.presence.av):"🏝️",pts:[],ms:[],pick:[]};});
  beginMatch({mode:"multi",mid:d.mid,qs,seed:Number(d.seed)||1,players,meKey,wager:w,pot:w*d.pl.length,ranked:false});
}
function onScore(msg){
  if(!match||msg.sameTab||msg.kind!=="viewer")return;
  const d=msg.data;
  if(!d||d.mid!==match.mid||!Array.isArray(d.p)||!Array.isArray(d.t))return;
  const p=match.players[msg.peer];
  if(!p)return;
  p.name=cleanName(d.n);p.av=cleanAv(d.av);
  p.pts=d.p.slice(0,N).map(x=>Math.max(0,Math.min(1000,Math.round(Number(x)||0))));
  p.ms=d.t.slice(0,N).map(x=>Math.round(Number(x)||0));
  refreshStand();
}
function emitScore(){
  if(!match||match.mode!=="multi"||!NR)return;
  const me=match.players[match.meKey];
  NR.emit("score",{mid:match.mid,n:SAVE.name,av:SAVE.av,p:me.pts.map(x=>x||0),t:me.ms.map(x=>x==null?-1:x)}).catch(()=>{});
}

/* ============ 對戰引擎 ============ */
function startSolo(ranked){
  ui.err="";fixWager();
  if(SAVE.coins<ui.wager){ui.err="金幣不足，先到銀行領錢。";ui.screen="home";return render();}
  const qs=pickQs(ui.subj),rnd=Math.random;
  const rk=ranked?SAVE.rank:0,lift=0.03*rk,speed=Math.max(.6,1-0.04*rk);
  const bots=[{name:"椰子蟹",av:"🦀",skill:Math.min(1.05,.88+lift)},{name:"海龜阿龜",av:"🐢",skill:Math.min(.98,.7+lift)}];
  const players={me:{name:SAVE.name,av:SAVE.av,pts:[],ms:[],pick:[]}};
  bots.forEach((b,bi)=>{
    const p={name:b.name,av:b.av,pts:[],ms:[],pick:[],bot:true};
    qs.forEach(q=>{
      const ok=rnd()<Math.min(.99,[.95,.8,.62][q.d]*b.skill);
      const ms=Math.max(900,Math.min(9500,Math.round((1300+rnd()*5200)*(1+q.d*.25)*(bi?1.25:1)*speed)));
      p.ms.push(ms);p.pts.push(ok?scoreFor(ms):0);
    });
    players["bot"+bi]=p;
  });
  beginMatch({mode:"solo",mid:"solo"+Date.now(),qs,seed:Math.floor(Math.random()*1e9),players,meKey:"me",wager:ui.wager,pot:ui.wager*3,ranked:!!ranked});
}
function beginMatch(m){
  SAVE.coins-=m.wager;persist();
  m.t0=performance.now();m.ph="";m.qi=-2;m.rewarded=false;m.reward=null;
  m.orders=m.qs.map((q,i)=>shuffled([0,1,2,3],m.seed+i*977));
  match=m;ui.screen="battle";
  if(NR)setPresence("play");
  stopTicker();timerId=setInterval(tick,50);
  tick();
}
function stopTicker(){if(timerId){clearInterval(timerId);timerId=null;}}
function finalizeTo(k){
  const me=match.players[match.meKey];
  for(let i=0;i<k&&i<N;i++){if(me.pts[i]==null){me.pts[i]=0;me.ms[i]=-1;me.pick[i]=-1;}}
}
function tick(){
  if(!match)return;
  const el=performance.now()-match.t0;
  let ph,qi=-1,within=0;
  if(el<COUNT){ph="count";within=el;}
  else{
    const e2=el-COUNT;qi=Math.floor(e2/CYCLE);
    if(qi>=N){ph="end";qi=N;}
    else{within=e2-qi*CYCLE;ph=within<PREVIEW?"preview":within<PREVIEW+ANSWER?"answer":"reveal";}
  }
  if(ph!==match.ph||qi!==match.qi){
    match.ph=ph;match.qi=qi;
    if(ph==="reveal"){finalizeTo(qi+1);emitScore();}
    else if(ph==="end"){finalizeTo(N);emitScore();setTimeout(emitScore,600);stopTicker();ui.screen="result";setTimeout(award,1200);}
    else finalizeTo(qi);
    render();
  }
  if(ph==="end")return;
  const tm=document.getElementById("tm"),fill=document.getElementById("fill"),live=document.getElementById("live");
  if(!tm)return;
  let remain=0,total=1;
  if(ph==="count"){remain=COUNT-within;total=COUNT;tm.textContent=Math.ceil(remain/1000);}
  else if(ph==="preview"){remain=PREVIEW-within;total=PREVIEW;tm.textContent=(remain/1000).toFixed(1);}
  else if(ph==="answer"){const used=within-PREVIEW;remain=ANSWER-used;total=ANSWER;tm.textContent=(Math.max(0,remain)/1000).toFixed(1);if(live)live.textContent=scoreFor(used);}
  if(fill){fill.style.transform="scaleX("+Math.max(0,Math.min(1,remain/total))+")";fill.classList.toggle("low",ph==="answer"&&remain<3000);}
}
function pick(j){
  const m=match;if(!m||m.ph!=="answer")return;
  const me=m.players[m.meKey],qi=m.qi;
  if(me.pts[qi]!=null)return;
  const ms=Math.max(0,Math.round(performance.now()-(m.t0+COUNT+qi*CYCLE+PREVIEW)));
  if(ms>ANSWER)return;
  const orig=m.orders[qi][j];
  me.pick[qi]=orig;me.ms[qi]=ms;me.pts[qi]=orig===m.qs[qi].a?scoreFor(ms):0;
  render();
}
function totals(m,up){
  const out=Object.entries(m.players).map(([key,p])=>{
    let total=0,t=0;
    for(let i=0;i<=up&&i<N;i++){total+=p.pts[i]||0;t+=(p.ms[i]>0?p.ms[i]:ANSWER);}
    return {key,name:p.name,av:p.av,total,t,pts:p.pts};
  });
  out.sort((a,b)=>b.total-a.total||a.t-b.t);
  return out;
}
function upTo(){return match.ph==="reveal"?match.qi:(match.ph==="end"?N-1:match.qi-1);}
function standHTML(){
  const m=match,up=upTo(),list=totals(m,up),max=Math.max(1000,...list.map(x=>x.total));
  return list.map((x,i)=>`<li class="${x.key===m.meKey?"me":""}"><span class="rk">${i+1}</span><span class="av" aria-hidden="true">${x.av}</span><span class="nm">${esc(x.name)}${x.key===m.meKey?"<em>你</em>":""}</span><span class="trk"><i style="width:${Math.round(x.total/max*100)}%"></i></span><b>${x.total}</b><span class="dl">${m.ph==="reveal"&&x.pts[up]!=null?"+"+x.pts[up]:""}</span></li>`).join("");
}
function refreshStand(){const el=document.getElementById("stand");if(el&&match)el.innerHTML=standHTML();if(ui.screen==="result"&&match)renderResult();}
function renderBattle(){
  const m=match;if(!m)return;
  const ph=m.ph,qi=m.qi,me=m.players[m.meKey];
  const myTotal=totals(m,upTo()).find(x=>x.key===m.meKey);
  if(ph==="count"){
    $app.innerHTML=`<div class="card count"><p class="label">準備出發</p><b id="tm">3</b><div class="timer" style="margin-top:16px"><div class="track"><div class="fill" id="fill"></div></div></div></div>
    <div class="card"><div class="label" style="margin-bottom:10px">本局玩家</div><ul class="stand" id="stand">${standHTML()}</ul></div>`;
    return;
  }
  if(ph==="end")return;
  const q=m.qs[qi],order=m.orders[qi];
  const head=`<div class="hud"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill">第 ${qi+1} / ${N} 題</span><span class="pill">${SNAME[q.s]}</span><span class="pill">${DNAME[q.d]}</span><span class="pill">獎池 $${m.pot}</span></div><div style="text-align:right"><div class="label">積分</div><div class="score">${myTotal?myTotal.total:0}</div></div></div>`;
  let body="";
  const answered=me.pts[qi]!=null;
  if(ph==="preview"){
    body=`<div><span class="phase look">看題時間</span></div>
      <div class="timer"><div class="track"><div class="fill" id="fill"></div></div><span id="tm">5.0</span></div>
      <div class="card q">${esc(q.q)}</div>
      <div class="opts" aria-hidden="true">${[0,1,2,3].map(i=>`<div class="opt mask"><span class="L">${"ABCD"[i]}</span><span class="sk"></span></div>`).join("")}</div>
      <p class="muted">倒數結束後出現選項，先想好答案。</p>`;
  }else if(ph==="answer"){
    body=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="phase race">搶答</span><span class="live">現在答對可得 <b id="live">1000</b> 分</span></div>
      <div class="timer"><div class="track"><div class="fill" id="fill"></div></div><span id="tm">10.0</span></div>
      <div class="card q">${esc(q.q)}</div>
      <div class="opts">${order.map((orig,j)=>`<button class="opt ${answered?(me.pick[qi]===orig?"sel":"dim"):""}" data-act="pick" data-j="${j}" ${answered?"disabled":""}><span class="L">${"ABCD"[j]}</span><span>${esc(q.o[orig])}</span></button>`).join("")}</div>
      ${answered?`<p class="muted">答案已鎖定，等這題時間結束。</p>`:""}`;
  }else{
    const ok=me.pick[qi]===q.a,gained=me.pts[qi]||0;
    body=`<div class="banner ${ok?"ok":"no"}">${me.pick[qi]===-1?"這題沒有作答，0 分":ok?`答對了！+${gained} 分，用時 ${(me.ms[qi]/1000).toFixed(2)} 秒`:"答錯了，0 分"}</div>
      <div class="card q">${esc(q.q)}</div>
      <div class="opts">${order.map((orig,j)=>`<div class="opt ${orig===q.a?"right":(me.pick[qi]===orig?"wrong":"dim")}"><span class="L">${"ABCD"[j]}</span><span>${esc(q.o[orig])}</span></div>`).join("")}</div>
      <p class="muted">${qi<N-1?"下一題馬上開始。":"對戰結束，正在統計成績。"}</p>`;
  }
  $app.innerHTML=`${head}${body}<div class="card"><div class="label" style="margin-bottom:10px">即時排名</div><ul class="stand" id="stand">${standHTML()}</ul></div>`;
}
function award(){
  if(!match||match.rewarded)return;
  const m=match;
  const list=totals(m,N-1);
  const rank=list.findIndex(x=>x.key===m.meKey)+1;
  const total=list[rank-1].total;
  const win=rank===1;
  const gain=win?m.pot:0,net=gain-m.wager;
  const xp=Math.round(total/20)+15+(win?15:0);
  const before=levelOf(SAVE.xp).lvl;
  SAVE.coins+=gain;SAVE.xp+=xp;SAVE.games+=1;if(win)SAVE.wins+=1;
  let rankUp=false;
  if(m.ranked&&win&&SAVE.rank<RANKS.length-1){SAVE.rw+=1;if(SAVE.rw>=needWins(SAVE.rank)){SAVE.rank+=1;SAVE.rw=0;rankUp=true;}}
  persist();
  m.rewarded=true;
  m.reward={net,gain,xp,rank,total,win,up:levelOf(SAVE.xp).lvl>before,lv:levelOf(SAVE.xp).lvl,rankUp};
  if(NR)setPresence("play");
  if(ui.screen==="result")renderResult();
}
function renderResult(){
  const m=match;if(!m)return;
  const list=totals(m,N-1),me=m.players[m.meKey],r=m.reward;
  const rows=list.map((x,i)=>`<li class="${x.key===m.meKey?"me":""}"><span class="rk">${i+1}</span><span class="av" aria-hidden="true">${x.av}</span><span class="nm">${esc(x.name)}${x.key===m.meKey?"<em>你</em>":""}</span><span class="trk"><i style="width:${Math.round(x.total/Math.max(1,list[0].total)*100)}%"></i></span><b>${x.total}</b><span class="dl"></span></li>`).join("");
  const qc=m.qs.map((q,i)=>{const ok=me.pick[i]===q.a;return `<div class="qc ${ok?"ok":"no"}"><b>${me.pts[i]||0}</b>${me.ms[i]>0?(me.ms[i]/1000).toFixed(1)+" 秒":"未答"}</div>`;}).join("");
  const L=levelOf(SAVE.xp);
  let reward=`<p class="muted">結算中…</p>`;
  if(r){
    const money=r.net>=0?"+$"+r.net:"-$"+(-r.net);
    let rk="";
    if(m.ranked){
      if(r.rankUp)rk=`<div class="up">升段了！晉升到 ${RANKS[SAVE.rank]}</div>`;
      else if(SAVE.rank>=RANKS.length-1)rk=`<p class="muted">你已經是最高段位 ${RANKS[SAVE.rank]}。</p>`;
      else rk=`<p class="muted">${r.win?"排位勝場":"這局沒贏，排位勝場不變"}：${SAVE.rw} / ${needWins(SAVE.rank)}，目標 ${RANKS[SAVE.rank+1]}</p>`;
    }
    reward=`<div class="tiles"><div class="tile"><b>${r.total}</b><span>本局積分</span></div><div class="tile"><b>${money}</b><span>金幣</span></div><div class="tile"><b>+${r.xp}</b><span>經驗</span></div></div>
    <div class="banner ${r.win?"ok":"no"}">${r.win?`你拿走全部獎池 $${m.pot}`:`你的賭注 $${m.wager} 被第一名拿走`}</div>
    ${rk}
    ${r.up?`<div class="up">升級了！現在是 Lv.${r.lv} ${titleOf(r.lv)}</div>`:`<div class="lv"><span>Lv.${L.lvl} ${titleOf(L.lvl)}</span><span class="xp" style="max-width:none"><i style="width:${Math.round(L.cur/L.need*100)}%"></i></span></div>`}`;
  }
  const multi=m.mode==="multi";
  $app.innerHTML=`<h2>${r?(r.rank===1?"你是第一名！":`你拿到第 ${r.rank} 名`):"對戰結束"}</h2>
  <div class="card"><div class="label" style="margin-bottom:10px">最終排名</div><ul class="stand" id="stand">${rows}</ul></div>
  <div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="label">你的每題成績</div><div class="qchips">${qc}</div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:12px">${reward}</div>
  <div class="row-btns">${multi?`<button class="btn go" data-act="backlobby" style="font-size:18px">回到房間</button><button class="btn ghost" data-act="leave">離開房間</button>`:`<button class="btn go" data-act="${m.ranked?"ranked":"solo"}" style="font-size:18px">再玩一局</button><button class="btn ghost" data-act="home">回到島上</button>`}</div>`;
}

/* ============ 事件 ============ */
$app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==="pick")return pick(Number(b.dataset.j));
  if(a==="subj"){ui.subj=b.dataset.k;return render();}
  if(a==="mode"){ui.mode=b.dataset.m;ui.err="";return render();}
  if(a==="solo")return startSolo(false);
  if(a==="ranked")return startSolo(true);
  if(a==="savenow"){if(CLOUD){dirty=true;clearTimeout(pushT);push();}return;}
  if(a==="bank"){if(bankLeft()===0){SAVE.coins+=BANK_AMT;SAVE.bankAt=Date.now();persist();}return render();}
  if(a==="wager"){const w=Number(b.dataset.w);if(WAGERS.includes(w)&&w<=SAVE.coins){ui.wager=w;if(NR)setPresence("lobby");}return render();}
  if(a==="create"){return joinRoom(genCode());}
  if(a==="join"){
    const v=(document.getElementById("code").value||"").trim().toLowerCase();
    if(!/^[a-z0-9]{3,6}$/.test(v)){ui.code=v;ui.err="房間代碼是 3 到 6 個英文字母或數字。";return render();}
    return joinRoom(v);
  }
  if(a==="startmulti")return hostStart();
  if(a==="leave")return leaveRoom();
  if(a==="backlobby"){stopTicker();match=null;ui.screen="lobby";setPresence("lobby");return render();}
  if(a==="home"){stopTicker();match=null;ui.screen="home";ui.err="";return render();}
  if(a==="shop"){ui.screen="shop";ui.err="";return render();}
  if(a==="buy"){
    const it=AVATARS.find(x=>x.e===b.dataset.e);
    if(it&&!SAVE.owned.includes(it.e)&&SAVE.coins>=it.p){SAVE.coins-=it.p;SAVE.owned.push(it.e);SAVE.av=it.e;persist();}
    return render();
  }
  if(a==="equip"){if(SAVE.owned.includes(b.dataset.e)){SAVE.av=b.dataset.e;persist();}return render();}
  if(a==="copy"){
    const t=ui.code.toUpperCase();
    try{navigator.clipboard.writeText(t).catch(()=>{});}catch(err){}
    b.textContent="已複製";setTimeout(()=>{if(b.isConnected)b.textContent="複製代碼";},1200);
  }
});
$app.addEventListener("input",e=>{
  if(e.target.id==="nm"){SAVE.name=(e.target.value||"").trim().slice(0,8)||"島民";persist();}
  if(e.target.id==="code")ui.code=e.target.value;
});
initCloud();
setInterval(()=>{
  if(ui.screen!=="home")return;
  const el=document.getElementById("bankbtn");if(!el)return;
  const left=bankLeft(),ready=left===0;
  if(ready!==(el.dataset.ready==="1"))return render();
  if(!ready)el.textContent="還要 "+fmtLeft(left);
},1000);
render();
</script>

</body>
</html>
